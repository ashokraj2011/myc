# Attach skills to exactly one agent OR workflow. Agent skills follow the agent everywhere;
# workflow skills apply only in that workflow, independently of its selected agent.
# steps: restrict to these steps (omitted: all target steps). use: when to use it.
attachments:
  - skill: demo-web-screenshot-intake
    agent: demo-web-analyst
    steps:
      - demo-web-intake
    use: Before writing the screenshot acceptance contract
  - skill: demo-web-defect-repair
    agent: demo-web-developer
    steps:
      - demo-web-repair
    use: Before editing code and before publication
  - skill: demo-web-screenshot-check
    agent: demo-web-tester
    steps:
      - demo-web-check
      - demo-web-retest
    use: On every initial check and fresh retest
  - skill: ashok-dev-guidance
    workflow: ashok
    steps:
      - ashok-dev
  - skill: ashok-intake-guidance
    workflow: ashok
    steps:
      - ashok-intake
  - skill: ashok-test-guidance
    workflow: ashok
    steps:
      - ashok-test
